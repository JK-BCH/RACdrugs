site_name: RAC-Drugs 플래시카드 (개인 학습용)
site_description: RAPS RAC-Drugs Spring 2027 준비 덱 — 규정 기준일 2026-09-01. 비공식·개인 학습 자료.
docs_dir: cards
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.details

